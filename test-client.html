<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙生九子·五行对战 - 测试客户端</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-panel {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .control-panel h3 {
            margin-top: 0;
            color: #ffd700;
        }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .input-group {
            margin: 10px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffd700;
        }
        .input-group input {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.9);
        }
        .game-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 0;
        }
        .log-entry.info { color: #87ceeb; }
        .log-entry.success { color: #90ee90; }
        .log-entry.warning { color: #ffd700; }
        .log-entry.error { color: #ff6b6b; }
        .player-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐉 龙生九子·五行对战</h1>
            <p>测试客户端 - 连接游戏服务器</p>
        </div>

        <div class="status">
            <h3>连接状态</h3>
            <p>服务器: <span id="serverStatus">未连接</span></p>
            <p>玩家ID: <span id="playerId">-</span></p>
            <p>元素: <span id="playerElement">-</span></p>
            <p>房间状态: <span id="roomState">-</span></p>
        </div>

        <div class="controls">
            <div class="control-panel">
                <h3>连接控制</h3>
                <div class="input-group">
                    <label for="serverUrl">服务器地址:</label>
                    <input type="text" id="serverUrl" value="ws://localhost:8787" placeholder="ws://localhost:8787">
                </div>
                <button class="btn" id="connectBtn" onclick="connect()">连接</button>
                <button class="btn" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
            </div>

            <div class="control-panel">
                <h3>游戏控制</h3>
                <button class="btn" id="moveBtn" onclick="move()" disabled>移动</button>
                <button class="btn" id="pickupBtn" onclick="pickup()" disabled>拾取</button>
                <button class="btn" id="attackBtn" onclick="attack()" disabled>攻击</button>
                <button class="btn" id="useItemBtn" onclick="useItem()" disabled>使用道具</button>
            </div>

            <div class="control-panel">
                <h3>技能系统</h3>
                <div id="skillsList">未连接</div>
            </div>
        </div>

        <div class="game-info">
            <h3>游戏信息</h3>
            <div class="player-stats">
                <div class="stat-card">
                    <div class="stat-value" id="playerHp">-</div>
                    <div>生命值</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="playerAtk">-</div>
                    <div>攻击力</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="playerDef">-</div>
                    <div>防御力</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="playerAgi">-</div>
                    <div>敏捷</div>
                </div>
            </div>
        </div>

        <div class="game-info">
            <h3>游戏日志</h3>
            <div class="log" id="gameLog"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let playerId = null;
        let playerElement = null;
        let roomState = 'lobby';
        let playerStats = {};

        function log(message, type = 'info') {
            const logDiv = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus() {
            document.getElementById('serverStatus').textContent = ws && ws.readyState === WebSocket.OPEN ? '已连接' : '未连接';
            document.getElementById('playerId').textContent = playerId || '-';
            document.getElementById('playerElement').textContent = playerElement || '-';
            document.getElementById('roomState').textContent = roomState || '-';
        }

        function updateStats() {
            if (playerStats.hp !== undefined) document.getElementById('playerHp').textContent = playerStats.hp;
            if (playerStats.atk !== undefined) document.getElementById('playerAtk').textContent = playerStats.atk;
            if (playerStats.def !== undefined) document.getElementById('playerDef').textContent = playerStats.def;
            if (playerStats.agi !== undefined) document.getElementById('playerAgi').textContent = playerStats.agi;
        }

        function connect() {
            const url = document.getElementById('serverUrl').value;
            try {
                ws = new WebSocket(url);
                
                ws.onopen = function() {
                    log('WebSocket连接已建立', 'success');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                    updateStatus();
                };

                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (e) {
                        log('消息解析错误: ' + e.message, 'error');
                    }
                };

                ws.onclose = function() {
                    log('WebSocket连接已关闭', 'warning');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                    document.getElementById('moveBtn').disabled = true;
                    document.getElementById('pickupBtn').disabled = true;
                    document.getElementById('attackBtn').disabled = true;
                    document.getElementById('useItemBtn').disabled = true;
                    updateStatus();
                };

                ws.onerror = function(error) {
                    log('WebSocket错误: ' + error, 'error');
                };

            } catch (e) {
                log('连接失败: ' + e.message, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
            playerId = null;
            playerElement = null;
            roomState = 'lobby';
            playerStats = {};
            updateStatus();
            updateStats();
            document.getElementById('skillsList').innerHTML = '未连接';
        }

        function handleMessage(data) {
            switch (data.t) {
                case 'hello':
                    playerId = data.id;
                    playerElement = data.element;
                    log(`欢迎! 玩家ID: ${data.id}, 元素: ${data.element}`, 'success');
                    updateStatus();
                    break;
                
                case 'snapshot':
                    if (data.s && data.s.players) {
                        const player = data.s.players.find(p => p.id === playerId);
                        if (player) {
                            playerStats = player;
                            updateStats();
                        }
                    }
                    if (data.match) {
                        roomState = data.match.state;
                        updateStatus();
                    }
                    break;
                
                case 'countdown':
                    log('游戏即将开始，倒计时中...', 'warning');
                    break;
                
                case 'start':
                    log('游戏开始!', 'success');
                    document.getElementById('moveBtn').disabled = false;
                    document.getElementById('pickupBtn').disabled = false;
                    document.getElementById('attackBtn').disabled = false;
                    document.getElementById('useItemBtn').disabled = false;
                    break;
                
                case 'settlement':
                    log(`游戏结束! 获胜者: ${data.winner || '无'}, MVP: ${data.mvp || '无'}`, 'success');
                    break;
                
                default:
                    log(`收到消息: ${data.t}`, 'info');
            }
        }

        function move() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            // 随机移动
            const vx = (Math.random() - 0.5) * 2;
            const vy = (Math.random() - 0.5) * 2;
            
            const message = {
                t: 'move',
                vx: vx,
                vy: vy
            };
            
            ws.send(JSON.stringify(message));
            log(`移动: vx=${vx.toFixed(2)}, vy=${vy.toFixed(2)}`, 'info');
        }

        function pickup() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const message = { t: 'pickup' };
            ws.send(JSON.stringify(message));
            log('尝试拾取物品', 'info');
        }

        function attack() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const message = { t: 'attack' };
            ws.send(JSON.stringify(message));
            log('尝试攻击', 'info');
        }

        function useItem() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const message = { t: 'useItem', itemId: 'potion' };
            ws.send(JSON.stringify(message));
            log('使用道具: 疗愈丹', 'info');
        }

        // 初始化
        updateStatus();
        log('测试客户端已加载，请连接到游戏服务器', 'info');
    </script>
</body>
</html>
